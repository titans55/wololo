<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
  <div class="wo-login-card__title">Sign In</div>

  <div class="form-group">
    <label for="username">Username</label>
    <input
      id="username"
      type="text"
      class="form-control"
      formControlName="username"
      placeholder="Enter your username"
      autocomplete="username"
    />
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      class="form-control"
      formControlName="password"
      placeholder="Enter your password"
      autocomplete="current-password"
    />
  </div>

  <button
    type="submit"
    class="btn btn-gold btn-block"
    style="margin-top: 0.5rem;"
    [disabled]="loginForm.pristine"
  >
    Enter the Kingdom
  </button>

  <div class="wo-login-card__footer" style="margin-top: 0.9rem;">
    <label style="margin:0; display:flex; align-items:center; gap:0.4rem; text-transform:none; letter-spacing:0;">
      <input type="checkbox" /> Remember me
    </label>
    <a href="#">Forgot Password?</a>
  </div>

  <ng-container *ngIf="serversideErrors && serversideErrors.nonFieldErrors">
    <div *ngFor="let msg of serversideErrors.nonFieldErrors" style="margin-top: 0.75rem;">
      <ngb-alert type="danger" [dismissible]="false">{{ msg }}</ngb-alert>
    </div>
  </ng-container>
</form>

<div class="wo-login-card__register">
  Don't have an account? &nbsp;<a href="/register">Create one →</a>
</div>

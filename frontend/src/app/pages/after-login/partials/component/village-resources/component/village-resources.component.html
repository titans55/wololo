<div class="wo-resource-bar" *ngIf="currentWood">
  <div class="wo-village-switcher">
    <woo-switch-village></woo-switch-village>
  </div>

  <span class="wo-resource-item res-wood">
    <span class="ri">🪵</span>
    <span class="wo-res-label">Wood</span>
    <span class="wo-res-value" [class.at-cap]="currentWood.isCapacityReached">
      {{ currentWood.quantity }}
    </span>
  </span>

  <span class="wo-resource-item res-iron" *ngIf="currentIron">
    <span class="ri">⛏</span>
    <span class="wo-res-label">Iron</span>
    <span class="wo-res-value" [class.at-cap]="currentIron.isCapacityReached">
      {{ currentIron.quantity }}
    </span>
  </span>

  <span class="wo-resource-item res-clay" *ngIf="currentClay">
    <span class="ri">🧱</span>
    <span class="wo-res-label">Clay</span>
    <span class="wo-res-value" [class.at-cap]="currentClay.isCapacityReached">
      {{ currentClay.quantity }}
    </span>
  </span>

  <span class="wo-resource-item res-storage" *ngIf="storageCapacity">
    <span class="ri">🏛</span>
    <span class="wo-res-label">Storage</span>
    <span class="wo-res-value">{{ storageCapacity }}</span>
  </span>

  <span class="wo-resource-item res-pop"
    [class.over-cap]="populationInfo && populationInfo.currentPopulation >= populationInfo.populationLimit"
    *ngIf="populationInfo">
    <span class="ri">👥</span>
    <span class="wo-res-label">Pop</span>
    <span class="wo-res-value">
      {{ populationInfo.currentPopulation }}/{{ populationInfo.populationLimit }}
    </span>
  </span>

  <div class="building" buildingName="townCenter"></div>
  <div class="building" buildingName="storage"></div>
  <div class="building" buildingName="farm"></div>
  <div class="building" buildingName="barracks"></div>
  <div class="resources" resourceBuildingName="woodCamp" reseourceType="wood"></div>
  <div class="resources" resourceBuildingName="ironMine" reseourceType="iron"></div>
  <div class="resources" resourceBuildingName="clayPit" reseourceType="clay"></div>
</div>
